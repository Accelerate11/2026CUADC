<header><div><div class="eyebrow">CUADC / RELEASE LAB</div><h1>投放阶段 · 策略回放</h1><p>沿用视觉与飞控观测，学习何时释放救援载荷。</p></div><div class="tag">离线仿真 · 非实飞结果</div></header>
<div class="layout"><section class="card"><h2>俯视轨迹 <span class="note">　局部水平坐标 / m</span></h2><canvas id="scene"></canvas><div class="controls"><button id="play">播放</button><input id="timeline" type="range" min="0" value="0" aria-label="时间轴"><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div><div class="legend"><span style="color:#57dbc5">● 桶口与有效命中范围</span><span style="color:#8abaff">● 飞机与轨迹</span><span style="color:#ffcf72">× 载荷落点</span></div></section>

 document.querySelector('#time').textContent=f.t.toFixed(2)+' s';document.querySelector('#velocity').textContent=Math.hypot(f.observation.vx,f.observation.vy).toFixed(2)+' m/s';document.querySelector('#age').textContent=f.observation.age.toFixed(2)+' s';document.querySelector('#status').textContent=index===frames.length-1?colors[finish.outcome]:(f.observation.visible?'视觉有效 · 对准中':'视觉不可用 · 等待');slider.value=index;
}
document.querySelector('#play').onclick=()=>{if(index===frames.length-1){index=0;clock=0}playing=!playing;last=0;document.querySelector('#play').textContent=playing?'暂停':'播放';draw()};
slider.oninput=()=>{index=Number(slider.value);clock=frames[index].t;draw()};window.onresize=draw;

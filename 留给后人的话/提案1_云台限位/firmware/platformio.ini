[platformio]
default_envs = nucleo_g431rb

[env:nucleo_g431rb]
platform = ststm32@19.4.0
board = nucleo_g431rb
framework = stm32cube
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -D HSE_VALUE=24000000U
    -Wl,-u,_printf_float
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
test_framework = unity

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -I include
build_src_filter =
    -<*>
    +<attitude_filter.cpp>
    +<gimbal_controller.cpp>

schema: cuadc.aircraft.v1
aircraft: v6x_3E0032
layers:
  calibration: v6x_3E0032__d435i_213622075597

# Candidate-only profile.  It is intentionally not flight-authorized and does
# not assert that any airframe/camera/payload calibration has been signed.
approval:
  flight_enable: false
  calibration_approved: false
  approval_reference: ""

fcu:
  # Historical candidate from the operator's V6X record.  Verify the exact
  # /dev/serial/by-id symlink and baud on the aircraft before approval.
  device: /dev/serial/by-id/usb-ArduPilot_CUAV-V6X-v2_3E0032000551333033393439-if00
  baud: 115200
  fcu_url: serial:///dev/serial/by-id/usb-ArduPilot_CUAV-V6X-v2_3E0032000551333033393439-if00:115200
  gcs_url: ""
  protocol: v2.0
  target_system: 1
  target_component: 1
  verification_status: candidate_requires_on_aircraft_check

payload:
  # Latest modular-release candidate only.  A historical V6X prototype record
  # instead used CH9/CH10 and 1200/1500 PWM, so this profile must be resolved by
  # an airframe-specific bench test before its approval flags may be changed.
  servo_channels: [7, 8]
  stowed_pwm: [1100, 1100]
  release_pwm: [1900, 1900]
  release_duration_s: [0.7, 0.7]
  initialize_stowed: true
  return_to_stowed: true
  command_ack_timeout_ms: 2000
  verification_status: candidate_conflicts_with_historical_ch9_ch10_profile

hard_limits:
  # Conservative candidate envelope; verify against this airframe and FCU tune.
  max_horizontal_speed_m_s: 4.5
  max_drop_speed_m_s: 0.8
  max_mission_altitude_m: 6.0
  max_release_tilt_deg: 5.0
  verification_status: candidate_requires_on_aircraft_check

mission_parameters:
  lock_mission_yaw_to_initial_heading: true
  yaw_to_target: false
  auto_arm_on_guided: false

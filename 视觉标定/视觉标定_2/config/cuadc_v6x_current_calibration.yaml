metadata:
  aircraft: CUADC V6X current aircraft
  date: 2026-09-07
  status: current_candidate
  notes: >-
    Current values adopted for use at time of packaging. Re-verify after any camera,
    payload mechanism, FCU, frame, or mount disassembly.

coordinate_frames:
  flight_vision: FLU
  independent_viewer: FRD
  flu_to_frd: [x, -y, -z]

camera_flu:
  camera_offset_body_m: [0.0, 0.0, -0.35]
  camera_xy_calib_bias_m: [0.047805, -0.014577]
  camera_optical_to_body_rotation:
    [-0.971358, 0.237622, 0.0,
      0.237622, 0.971358, 0.0,
      0.0,      0.0,     -1.0]
  depth_reference_mode: rim_direct
  target_depth_offset_m: 0.0
  depth_scale_calibration: 1.0

payloads_flu:
  p1_servo9: [0.0260, -0.0650, -0.3200]
  p2_servo10: [0.0109, 0.0720, -0.3200]

flight_profile:
  search_alt_m: 2.2
  coarse_align_alt_m: 1.7
  fine_align_alt_m: 1.3
  release_alt_m: 1.3

ros_topics:
  formal_detection_flu: /perception/drop_buckets_body
  annotated_direct: /cuadc/calib/annotated
  calibration_image: /cuadc/calib/color/image_raw
  calibration_camera_info: /cuadc/calib/color/camera_info
  calibration_detection_frd: /vision_servo/targets_body
  independent_annotated: /vision_servo/alignment/image
